<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos — Robert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141415;
            --surface-2: #1a1a1c;
            --border: #232325;
            --border-strong: #333336;
            --text: #f5f5f5;
            --text-soft: #d4d4d4;
            --text-muted: #9b9ba3;
            --text-dim: #6f6f76;
            --white: #fafafa;
            --black: #0a0a0a;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-serif: 'Source Serif 4', Georgia, serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        ::selection { background: var(--white); color: var(--black); }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            gap: 1rem;
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text); }
        .logo-name { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 500; }

        .logo-badge {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-soft);
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.9rem 1.6rem;
            border-radius: 12px;
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.25s ease;
            cursor: pointer;
            font-family: var(--font-sans);
        }

        .btn-dark { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
        .btn-dark:hover { background: var(--surface-2); border-color: #4a4a4e; transform: translateY(-2px); }
        .btn-small { padding: 0.6rem 1.3rem; border-radius: 10px; font-size: 0.88rem; }

        .page-hero {
            padding: 10rem 1.5rem 3rem;
            text-align: center;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,0.05), transparent 70%);
        }

        .section-tag {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 1rem;
        }

        .page-hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            font-weight: 500;
            line-height: 1.15;
            margin-bottom: 1rem;
        }

        .page-hero h1 em { font-style: italic; }

        .count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-dim); margin-bottom: 2.5rem; }

        .video-filters { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; max-width: 800px; margin: 0 auto; }

        .filter-pill {
            font-family: var(--font-sans);
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-soft);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            padding: 0.55rem 1.2rem;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .filter-pill:hover { border-color: #4a4a4e; transform: translateY(-1px); }
        .filter-pill.active { background: var(--white); color: var(--black); border-color: var(--white); }

        main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem 6rem; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease both;
        }

        .video-card:hover { transform: translateY(-4px); border-color: var(--border-strong); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .video-thumb {
            aspect-ratio: 16 / 9;
            background-color: #121213;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-thumb > span {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .thumb-base, .thumb-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .thumb-media { opacity: 0; transition: opacity 0.35s ease; }
        .video-card:hover .thumb-media { opacity: 1; }

        .play {
            position: absolute;
            width: 56px;
            height: 56px;
            background: var(--white);
            color: var(--black);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            padding-left: 4px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
            z-index: 2;
        }

        .video-card:hover .play { opacity: 1; transform: scale(1); }

        .video-body { padding: 1.4rem; }

        .video-tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-soft);
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.9rem;
        }

        .video-body h3 { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 500; margin-bottom: 0.5rem; }
        .video-body p { color: var(--text-muted); font-size: 0.92rem; }

        .empty {
            text-align: center;
            padding: 5rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        /* ============ MODAL ============ */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal.open { display: flex; }

        .modal-content {
            width: min(960px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            animation: fadeIn 0.3s ease both;
        }

        .modal-video { aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; }
        .modal-video iframe { width: 100%; height: 100%; border: 0; display: block; }

        /* YouTube: miniatura de fondo + botón que abre en YouTube */
        .yt-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .yt-fallback img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            transition: opacity 0.3s ease, transform 0.4s ease;
        }

        .yt-fallback:hover img { opacity: 0.7; transform: scale(1.03); }

        .yt-btn {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--white);
            color: var(--black);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.9rem 1.6rem;
            border-radius: 12px;
            transition: all 0.25s ease;
        }

        .yt-fallback:hover .yt-btn { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,255,255,0.15); }

        .modal-info {
            padding: 1.5rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
        }

        .modal-info h3 { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 500; margin: 0.8rem 0 0.5rem; }
        .modal-info p { color: var(--text-muted); font-size: 0.95rem; }

        .modal-link {
            display: inline-block;
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid var(--border-strong);
            padding-bottom: 2px;
            transition: color 0.25s ease;
        }

        .modal-link:hover { color: var(--text); }

        .modal-close {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .modal-close:hover { background: var(--white); color: var(--black); }

        /*  MODAL PANTALLA COMPLETA EN MÓVIL */
        @media (max-width: 768px) {
            .modal { padding: 0; }

            .modal-content {
                width: 100%;
                height: 100%;
                max-height: 100%;
                border-radius: 0;
                border: none;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .modal-video {
                flex: 1 1 auto;
                min-height: 55vh;
                aspect-ratio: auto;
            }

            .modal-info {
                flex: 0 0 auto;
                max-height: 45vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                padding: 1.2rem 1.2rem 2rem;
            }
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 2.5rem 1.5rem;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        @media (max-width: 600px) {
            .logo-badge { display: none; }
            .nav-container { padding: 1rem 1.25rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-name">Robert</span>
                <span class="logo-badge">Video Editor & Graphic Designer</span>
            </a>
            <a href="index.html" class="btn btn-dark btn-small">← Volver al inicio</a>
        </div>
    </nav>

    <header class="page-hero">
        <span class="section-tag">// Portafolio Audiovisual</span>
        <h1 id="page-title">Proyectos <em>audiovisuales</em></h1>
        <p class="count" id="page-count"></p>
        <div class="video-filters" id="filters"></div>
    </header>

    <main>
        <div class="video-grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none;">-- Aún no hay proyectos en esta categoría. Vuelve pronto. --</div>
    </main>

    <footer>© 2026 Robert — Video Editor & Graphic Designer</footer>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-video" id="modal-video"></div>
            <div class="modal-info">
                <div>
                    <span class="video-tag" id="modal-tag"></span>
                    <h3 id="modal-title"></h3>
                    <p id="modal-desc"></p>
                    <a id="modal-link" class="modal-link" target="_blank" rel="noopener" style="display:none;"></a>
                </div>
                <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           📦 DATOS: esta página carga su contenido desde
           data/videos.json (el archivo que edita tu Panel de
           Contenido en admin.html). Si ese archivo no existe,
           usa los datos de respaldo (VIDEOS_FALLBACK) de abajo.

           Formato de cada video:
           · video: link tal cual de YouTube o Vimeo (el sistema
             detecta la plataforma y extrae el ID solo).
           · categoria: una ("short-form") o varias
             (["long-form", "podcast"]).
           · thumb: "" = frame automático · o ruta/URL de portada propia.
           · hover: URL de GIF/MP4 para el preview al pasar el mouse.
           ========================================================= */

        let VIDEOS = [];
        const VIDEOS_FALLBACK = [
            { titulo: "Business & Mindset", categoria: "short-form", video: "https://vimeo.com/1218345311", thumb: "", hover: "", descripcion: "Edición dinámica orientada a la retención de audiencia. Incluye subtítulos animados, B-roll contextual, efectos visuales y cortes rápidos sobre formato talking head." },
            { titulo: "Finanzas & Estilo Dual", categoria: "short-form", video: "https://vimeo.com/1219288477", thumb: "", hover: "", descripcion: "Edición dinámica con división de pantalla. Estilo Victor Heras, incorpora subtítulos animados, gráficos contextuales y un contraste visual marcado entre personajes." },
            { titulo: "Podcast — La Historia de Aurelio", categoria: ["long-form", "podcast"], video: "https://www.youtube.com/watch?v=bSUGpEIaEmg", thumb: "", hover: "", descripcion: "Edición de formato largo para podcast: narrativa sostenida, ritmo y tratamiento de audio." },
            /* ⚠️ Video de muestra — reemplázalo o bórralo desde el panel: */
            { titulo: "Long-Form 02", categoria: "long-form", video: "https://www.youtube.com/watch?v=ScMzIvxBSi4", thumb: "", hover: "", descripcion: "En YouTube la miniatura se carga sola automáticamente." },
            { titulo: "AI Generated UGC Ad", categoria: "ads", video: "https://vimeo.com/1219288461", thumb: "", hover: "", descripcion: "Anuncio orientado a conversión: hook directo, ritmo publicitario y CTA claro." }
        ];

        let CATEGORIAS = {};
        const CATS_FALLBACK = {
            "short-form": "Short-Form",
            "long-form": "Long-Form",
            "podcast": "Podcast",
            "ads": "Ads"
            // "vsl": "VSL",
            // "saas": "SaaS"
        };

        /* Detecta plataforma y extrae el ID automáticamente */
        function resolverVideo(v) {
            if (v.tipo && v.videoId) return { tipo: v.tipo, id: v.videoId };

            let raw = String(v.video || "").trim();

            const mSrc = raw.match(/src=["']([^"']+)["']/i);
            if (mSrc) raw = mSrc[1];

            let tipo = "", id = "";

            if (/youtu\.?be/i.test(raw)) {
                tipo = "youtube";
                const m = raw.match(/(?:v=|\/embed\/|\/shorts\/|\/live\/|youtu\.be\/)([A-Za-z0-9_-]{11})/) || raw.match(/^([A-Za-z0-9_-]{11})$/);
                id = m ? m[1] : "";
            } else if (/vimeo/i.test(raw)) {
                tipo = "vimeo";
                const m = raw.match(/vimeo\.com\/(?:video\/)?(\d+)/) || raw.match(/^(\d+)$/);
                id = m ? m[1] : "";
            } else if (/^\d+$/.test(raw)) {
                tipo = "vimeo"; id = raw;
            } else if (/^[A-Za-z0-9_-]{11}$/.test(raw)) {
                tipo = "youtube"; id = raw;
            }

            return { tipo, id };
        }

        /* Categorías de un video (admite string o array) */
        function catsDe(v) {
            return Array.isArray(v.categoria) ? v.categoria : [v.categoria];
        }

        function catLabel(v) {
            return catsDe(v).map(c => CATEGORIAS[c] || c).join(" · ");
        }

        const grid = document.getElementById("grid");
        const empty = document.getElementById("empty");
        const filtersBox = document.getElementById("filters");
        const pageTitle = document.getElementById("page-title");
        const pageCount = document.getElementById("page-count");
        const modal = document.getElementById("modal");

        let current = leerCategoria();

        function leerCategoria() {
            const p = new URLSearchParams(window.location.search).get("categoria");
            if (CATEGORIAS[p]) return p;
            return Object.keys(CATEGORIAS)[0];
        }

        function pintarFiltros() {
            filtersBox.innerHTML = "";
            for (const key in CATEGORIAS) {
                const b = document.createElement("button");
                b.className = "filter-pill" + (key === current ? " active" : "");
                b.textContent = CATEGORIAS[key];
                b.onclick = () => {
                    current = key;
                    history.pushState(null, "", "?categoria=" + key);
                    pintarFiltros();
                    pintarGrid();
                };
                filtersBox.appendChild(b);
            }
        }

        function thumbBaseHTML(v) {
            if (v.thumb) return '<img class="thumb-base" src="' + v.thumb + '" alt="">';
            if (v._tipo === "youtube") return '<img class="thumb-base" data-yt="' + v._id + '" src="https://i.ytimg.com/vi/' + v._id + '/maxresdefault.jpg" alt="">';
            return '<img class="thumb-base" data-vimeo="' + v._id + '" alt="" style="opacity:0;transition:opacity .4s ease">';
        }

        /* Calidad de miniatura YouTube: maxres (720p) si existe, hqdefault si no */
        function revisarThumbsYT(container) {
            container.querySelectorAll("img[data-yt]").forEach(img => {
                const cambiar = () => {
                    if (img.dataset.fb) return;
                    if (img.naturalWidth <= 120) {
                        img.dataset.fb = "1";
                        img.src = "https://i.ytimg.com/vi/" + img.dataset.yt + "/hqdefault.jpg";
                    }
                };
                img.addEventListener("load", cambiar);
                img.addEventListener("error", () => {
                    if (!img.dataset.fb) {
                        img.dataset.fb = "1";
                        img.src = "https://i.ytimg.com/vi/" + img.dataset.yt + "/hqdefault.jpg";
                    }
                });
                if (img.complete) cambiar();
            });
        }

        function hoverHTML(v) {
            return /\.mp4|\.webm/i.test(v.hover)
                ? '<video class="thumb-media" src="' + v.hover + '" muted loop playsinline preload="none"></video>'
                : '<img class="thumb-media" src="' + v.hover + '" alt="">';
        }

        function pintarGrid() {
            const lista = VIDEOS.filter(v => catsDe(v).includes(current));

            pageTitle.innerHTML = "Proyectos <em>" + (CATEGORIAS[current] || "") + "</em>";

            pageCount.textContent = "// " + String(lista.length).padStart(2, "0") + (lista.length === 1 ? " proyecto" : " proyectos");

            empty.style.display = lista.length ? "none" : "block";
            grid.innerHTML = "";

            lista.forEach((v, i) => {
                const card = document.createElement("article");
                card.className = "video-card";
                card.style.animationDelay = (i * 0.06) + "s";

                card.innerHTML =
                    '<div class="video-thumb">' +
                        '<span>' + catLabel(v) + '</span>' +
                        thumbBaseHTML(v) +
                        (v.hover ? hoverHTML(v) : '') +
                        '<div class="play">▶</div>' +
                    '</div>' +
                    '<div class="video-body">' +
                        '<span class="video-tag">' + catLabel(v) + '</span>' +
                        '<h3>' + v.titulo + '</h3>' +
                        '<p>' + v.descripcion + '</p>' +
                    '</div>';

                card.onclick = () => abrirModal(v);

                const vid = card.querySelector("video.thumb-media");
                if (vid) {
                    card.addEventListener("mouseenter", () => vid.play().catch(() => {}));
                    card.addEventListener("mouseleave", () => vid.pause());
                }

                grid.appendChild(card);
            });

            cargarThumbsVimeo();
            revisarThumbsYT(grid);
        }

        function cargarThumbsVimeo() {
            grid.querySelectorAll("img[data-vimeo]").forEach(async img => {
                try {
                    const url = "https://vimeo.com/api/oembed.json?url=" + encodeURIComponent("https://vimeo.com/" + img.dataset.vimeo);
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.thumbnail_url) {
                        img.onload = () => { img.style.opacity = 1; };
                        img.src = data.thumbnail_url;
                    }
                } catch (e) {}
            });
        }

        function abrirModal(v) {
            const box = document.getElementById("modal-video");
            const link = document.getElementById("modal-link");

            if (v._tipo === "youtube") {
                /* YouTube: miniatura HD + botón que abre el video en YouTube */
                box.innerHTML =
                    '<a class="yt-fallback" href="https://www.youtube.com/watch?v=' + v._id + '" target="_blank" rel="noopener">' +
                        '<img data-yt="' + v._id + '" src="https://i.ytimg.com/vi/' + v._id + '/maxresdefault.jpg" alt="">' +
                        '<span class="yt-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Mirar en YouTube</span>' +
                    '</a>';
                revisarThumbsYT(box);
                link.style.display = "none";
            } else {
                /* Vimeo: reproductor embebido */
                box.innerHTML =
                    '<iframe src="https://player.vimeo.com/video/' + v._id + '?autoplay=1&muted=1" title="Reproductor de video" frameborder="0" ' +
                    'allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
                link.href = "https://vimeo.com/" + v._id;
                link.textContent = "¿No carga? Mirar en Vimeo ↗";
                link.style.display = "inline-block";
            }

            document.getElementById("modal-tag").textContent = catLabel(v);
            document.getElementById("modal-title").textContent = v.titulo;
            document.getElementById("modal-desc").textContent = v.descripcion;

            modal.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function cerrarModal() {
            modal.classList.remove("open");
            document.getElementById("modal-video").innerHTML = "";
            document.body.style.overflow = "";
        }

        document.getElementById("modal-close").onclick = cerrarModal;
        modal.onclick = e => { if (e.target === modal) cerrarModal(); };
        document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

        window.addEventListener("popstate", () => {
            current = leerCategoria();
            pintarFiltros();
            pintarGrid();
        });

        /* Arranque: carga data/videos.json (panel) o usa el respaldo */
        function arrancar() {
            VIDEOS.forEach(v => { const r = resolverVideo(v); v._tipo = r.tipo; v._id = r.id; });
            current = leerCategoria();
            pintarFiltros();
            pintarGrid();
        }

        fetch("data/videos.json?r=" + Date.now())
            .then(r => { if (!r.ok) throw 0; return r.json(); })
            .then(d => { VIDEOS = d.videos || []; CATEGORIAS = d.categorias || {}; arrancar(); })
            .catch(() => { VIDEOS = VIDEOS_FALLBACK.slice(); CATEGORIAS = Object.assign({}, CATS_FALLBACK); arrancar(); });
    </script>

</body>
</html>
