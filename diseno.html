<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño — Robert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0a0a; --surface:#141415; --surface-2:#1a1a1c; --border:#232325; --border-strong:#333336; --text:#f5f5f5; --text-soft:#d4d4d4; --text-muted:#9b9ba3; --text-dim:#6f6f76; --white:#fafafa; --black:#0a0a0a; --font-sans:'Inter',system-ui,-apple-system,sans-serif; --font-serif:'Source Serif 4',Georgia,serif; --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--text); font-family:var(--font-sans); line-height:1.6; overflow-x:hidden; }
::selection { background:var(--white); color:var(--black); }
nav { position:fixed; top:0; width:100%; background:rgba(10,10,10,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--border); z-index:100; }
.nav-container { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; gap:1rem; }
.logo { display:flex; align-items:center; gap:.75rem; text-decoration:none; color:var(--text); }
.logo-name { font-family:var(--font-serif); font-size:1.25rem; font-weight:500; }
.logo-badge { font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border-strong); padding:.3rem .6rem; border-radius:6px; white-space:nowrap; }
.btn { display:inline-flex; align-items:center; gap:.6rem; font-weight:600; font-size:.95rem; padding:.9rem 1.6rem; border-radius:12px; text-decoration:none; border:1px solid transparent; transition:all .25s ease; cursor:pointer; font-family:var(--font-sans); }
.btn-dark { background:var(--surface); border-color:var(--border-strong); color:var(--text); }
.btn-dark:hover { background:var(--surface-2); border-color:#4a4a4e; transform:translateY(-2px); }
.btn-small { padding:.6rem 1.3rem; border-radius:10px; font-size:.88rem; }
.page-hero { padding:10rem 1.5rem 3rem; text-align:center; background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,.05), transparent 70%); }
.section-tag { font-family:var(--font-mono); font-size:.8rem; color:var(--text-dim); letter-spacing:.05em; display:block; margin-bottom:1rem; }
.page-hero h1 { font-family:var(--font-serif); font-size:clamp(2.2rem,5vw,3.6rem); font-weight:500; line-height:1.15; margin-bottom:1rem; }
.page-hero h1 em { font-style:italic; }
.count { font-family:var(--font-mono); font-size:.8rem; color:var(--text-dim); margin-bottom:2.5rem; }
.filters { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; max-width:800px; margin:0 auto; }
.filter-pill { font-family:var(--font-sans); font-size:.88rem; font-weight:500; color:var(--text-soft); background:var(--surface); border:1px solid var(--border-strong); padding:.55rem 1.2rem; border-radius:999px; cursor:pointer; transition:all .25s ease; }
.filter-pill:hover { border-color:#4a4a4e; transform:translateY(-1px); }
.filter-pill.active { background:var(--white); color:var(--black); border-color:var(--white); }
main { max-width:1200px; margin:0 auto; padding:3rem 1.5rem 6rem; }
/* Masonry: las piezas conviven con formatos distintos sin huecos */
.d-grid { columns:2; column-gap:1rem; }
.d-card { break-inside:avoid; margin-bottom:1rem; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; transition:all .3s ease; animation:fadeIn .4s ease both; }
.d-card:hover { transform:translateY(-4px); border-color:var(--border-strong); }
@media (min-width:700px){ .d-grid { columns:3; column-gap:1.5rem; } .d-card { margin-bottom:1.5rem; } }
@media (min-width:1000px){ .d-grid { columns:4; } }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.d-thumb { background-color:#121213; background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px); background-size:24px 24px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.d-thumb.r45 { aspect-ratio:4/5; }
.d-thumb.r169 { aspect-ratio:16/9; }
.d-thumb.r11 { aspect-ratio:1/1; }
.d-thumb.r916 { aspect-ratio:9/16; }
.d-thumb > span { font-family:var(--font-mono); font-size:.72rem; letter-spacing:.12em; color:var(--text-dim); text-transform:uppercase; }
.d-thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
.d-card:hover .d-thumb img { transform:scale(1.05); }
.d-body { padding:1.4rem; }
.d-tag { display:inline-block; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border-strong); padding:.25rem .6rem; border-radius:6px; margin-bottom:.9rem; }
.d-body h3 { font-family:var(--font-serif); font-size:1.2rem; font-weight:500; margin-bottom:.5rem; }
.d-body p { color:var(--text-muted); font-size:.92rem; }
.empty { text-align:center; padding:5rem 1rem; font-family:var(--font-mono); font-size:.85rem; color:var(--text-dim); }
.lb { position:fixed; inset:0; background:rgba(5,5,5,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:300; display:none; align-items:center; justify-content:center; padding:1.5rem; }
.lb.open { display:flex; }
.lb-inner { position:relative; max-width:min(560px,92vw); width:100%; }
.lb-imgwrap { background:#000; border:1px solid var(--border-strong); border-radius:16px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.lb-imgwrap.r45 { aspect-ratio:4/5; } .lb-imgwrap.r169 { aspect-ratio:16/9; } .lb-imgwrap.r11 { aspect-ratio:1/1; } .lb-imgwrap.r916 { aspect-ratio:9/16; }
.lb-imgwrap img { width:100%; height:100%; object-fit:contain; }
.lb-info { margin-top:1rem; text-align:center; }
.lb-info .d-tag { margin-bottom:.6rem; }
.lb-info h3 { font-family:var(--font-serif); font-size:1.3rem; font-weight:500; margin-bottom:.3rem; }
.lb-info p { color:var(--text-muted); font-size:.92rem; }
.lb-btn { position:absolute; width:44px; height:44px; background:rgba(20,20,21,.85); border:1px solid var(--border-strong); border-radius:12px; color:var(--text); font-size:1.05rem; cursor:pointer; transition:all .25s ease; z-index:5; }
.lb-btn:hover { background:var(--white); color:var(--black); }
.lb-close { top:-14px; right:-14px; }
.lb-prev { left:-60px; top:50%; transform:translateY(-50%); }
.lb-next { right:-60px; top:50%; transform:translateY(-50%); }
@media (max-width:768px) {
  .lb-prev { left:6px; top:auto; bottom:-70px; transform:none; }
  .lb-next { right:6px; top:auto; bottom:-70px; transform:none; }
  .lb-close { top:-14px; right:0; }
}
footer { border-top:1px solid var(--border); padding:2.5rem 1.5rem; text-align:center; font-family:var(--font-mono); font-size:.78rem; color:var(--text-dim); }
@media (max-width:600px) { .logo-badge { display:none; } .nav-container { padding:1rem 1.25rem; } }
</style>
</head>
<body>
<nav>
  <div class="nav-container">
    <a href="index.html" class="logo"><span class="logo-name">Robert</span><span class="logo-badge">Video Editor & Graphic Designer</span></a>
    <a href="index.html" class="btn btn-dark btn-small">← Volver al inicio</a>
  </div>
</nav>

<header class="page-hero">
  <span class="section-tag">// Diseño & Social Media</span>
  <h1 id="page-title">Proyectos de <em>diseño</em></h1>
  <p class="count" id="page-count"></p>
  <div class="filters" id="filters"></div>
</header>

<main>
  <div class="d-grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">-- Aún no hay proyectos en esta categoría. Vuelve pronto. --</div>
</main>

<footer>© 2026 Robert — Video Editor & Graphic Designer</footer>

<div class="lb" id="lb">
  <div class="lb-inner">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Cerrar">✕</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Anterior">←</button>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Siguiente">→</button>
    <div class="lb-imgwrap r45" id="lb-imgwrap"><img id="lb-img" alt=""></div>
    <div class="lb-info">
      <span class="d-tag" id="lb-tag"></span>
      <h3 id="lb-title"></h3>
      <p id="lb-desc"></p>
    </div>
  </div>
</div>

<script>
/* 📦 Datos desde data/diseno.json (panel admin). Si no existe, respaldo. */
let DISENO=null;
const DEF={
  categorias:{"thumbs-yt":"Thumbnails YouTube","thumbs-ia":"Thumbnails IA","carruseles":"Carruseles","social":"Social Media"},
  piezas:[
    {titulo:"Thumbnail YouTube 01",categoria:"thumbs-yt",formato:"16:9",img:"img/diseno/yt-01.jpg",descripcion:"Miniatura de alto CTR. Reemplázame subiendo tu imagen a la carpeta img/."},
    {titulo:"Thumbnail YouTube 02",categoria:"thumbs-yt",formato:"16:9",img:"img/diseno/yt-02.jpg",descripcion:"Diseño orientado a clics y retención."},
    {titulo:"Thumbnail IA 01",categoria:"thumbs-ia",formato:"4:5",img:"img/diseno/ia-01.jpg",descripcion:"Composición generativa + retoque profesional."},
    {titulo:"Thumbnail IA 02",categoria:"thumbs-ia",formato:"4:5",img:"img/diseno/ia-02.jpg",descripcion:"Composición generativa + retoque profesional."},
    {titulo:"Carrusel 01",categoria:"carruseles",formato:"4:5",img:"img/diseno/carrusel-01.jpg",descripcion:"Secuencia visual con narrativa y ritmo."},
    {titulo:"Social Media 01",categoria:"social",formato:"4:5",img:"img/diseno/social-01.jpg",descripcion:"Pieza digital para marca o creador."}
  ]
};
const grid=document.getElementById("grid"), empty=document.getElementById("empty"),
filtersBox=document.getElementById("filters"), pageTitle=document.getElementById("page-title"),
pageCount=document.getElementById("page-count"), lb=document.getElementById("lb");
let current="", listaActual=[], lbIdx=0;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function ratioClass(p){ return {"4:5":"r45","16:9":"r169","1:1":"r11","9:16":"r916"}[p.formato]||"r45"; }

/* Sin "Todos": arranca en la primera categoría disponible */
function leerCategoria(){
  const p=new URLSearchParams(window.location.search).get("categoria");
  if(DISENO.categorias[p])return p;
  return Object.keys(DISENO.categorias)[0];
}
function pintarFiltros(){
  filtersBox.innerHTML="";
  for(const k in DISENO.categorias){
    const b=document.createElement("button");
    b.className="filter-pill"+(k===current?" active":"");
    b.textContent=DISENO.categorias[k];
    b.onclick=()=>ir(k);
    filtersBox.appendChild(b);
  }
}
function ir(k){
  current=k;
  history.pushState(null,"","?categoria="+k);
  pintarFiltros(); pintarGrid();
}
function pintarGrid(){
  listaActual=DISENO.piezas.filter(p=>p.categoria===current);
  pageTitle.innerHTML="Proyectos de <em>"+(DISENO.categorias[current]||"diseño")+"</em>";
  pageCount.textContent="// "+String(listaActual.length).padStart(2,"0")+(listaActual.length===1?" proyecto":" proyectos");
  empty.style.display=listaActual.length?"none":"block";
  grid.innerHTML="";
  listaActual.forEach((p,i)=>{
    const card=document.createElement("article");
    card.className="d-card";
    card.style.animationDelay=(i*0.06)+"s";
    card.innerHTML=
      '<div class="d-thumb '+ratioClass(p)+'"><span>'+esc(DISENO.categorias[p.categoria]||p.categoria)+'</span>'+
      (p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.titulo)+'" loading="lazy" onerror="this.style.display=\'none\'">':'')+'</div>'+
      '<div class="d-body"><span class="d-tag">'+esc(DISENO.categorias[p.categoria]||p.categoria)+'</span>'+
      '<h3>'+esc(p.titulo)+'</h3><p>'+esc(p.descripcion)+'</p></div>';
    card.onclick=()=>abrirLB(i);
    grid.appendChild(card);
  });
}
function abrirLB(i){ lbIdx=i; pintarLB(); lb.classList.add("open"); document.body.style.overflow="hidden"; }
function cerrarLB(){ lb.classList.remove("open"); document.body.style.overflow=""; }
function navLB(d){ const n=lbIdx+d; if(n<0||n>=listaActual.length)return; lbIdx=n; pintarLB(); }
function pintarLB(){
  const p=listaActual[lbIdx];
  document.getElementById("lb-imgwrap").className="lb-imgwrap "+ratioClass(p);
  document.getElementById("lb-img").src=p.img||"";
  document.getElementById("lb-tag").textContent=DISENO.categorias[p.categoria]||p.categoria;
  document.getElementById("lb-title").textContent=p.titulo;
  document.getElementById("lb-desc").textContent=p.descripcion;
}
document.getElementById("lb-close").onclick=cerrarLB;
document.getElementById("lb-prev").onclick=()=>navLB(-1);
document.getElementById("lb-next").onclick=()=>navLB(1);
lb.onclick=e=>{ if(e.target===lb)cerrarLB(); };
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")cerrarLB();
  if(e.key==="ArrowLeft")navLB(-1);
  if(e.key==="ArrowRight")navLB(1);
});
window.addEventListener("popstate",()=>{ current=leerCategoria(); pintarFiltros(); pintarGrid(); });

fetch("data/diseno.json?r="+Date.now())
  .then(r=>{ if(!r.ok)throw 0; return r.json(); })
  .then(d=>{ DISENO={categorias:d.categorias||{},piezas:d.piezas||[]}; arrancar(); })
  .catch(()=>{ DISENO=JSON.parse(JSON.stringify(DEF)); arrancar(); });
function arrancar(){ current=leerCategoria(); pintarFiltros(); pintarGrid(); }
</script>
</body>
</html>
